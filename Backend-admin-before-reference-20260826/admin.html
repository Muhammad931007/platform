<script type="text/javascript" charset="utf-8">
$(function(){
    // 监听订单通知轮询
    function checkOrderInfo() {
        $.get("/admin/index/order_info.html", function(result){
            if (typeof result === 'string') {
                try { result = JSON.parse(result); } catch(e){}
            }
            if (result && result.code === 1) {
                $('.deposit').html(result.deposit || 0);
                $('.order').html(result.order || 0);
                $('.deposit-test').html(result.deposit_test || 0);
                if (result.deposit > 0) {
                    var strAudio = "<audio id='audioPlay' src='/public/634.wav' hidden='true'>";
                    if ($("body").find("audio").length <= 0) $("body").append(strAudio);
                    var audio = document.getElementById("audioPlay");
                    if (audio) audio.play();
                }
            }
        });
    }
    checkOrderInfo();
    setInterval(checkOrderInfo, 15000);
});
</script>
